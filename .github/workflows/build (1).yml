name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned: this image already includes the Android SDK, so no extra setup step is needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Unzip project
        run: unzip -o AzerothTouch.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: azeroth-touch
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AzerothTouch-apk
          path: azeroth-touch/app/build/outputs/apk/release/*.apk
