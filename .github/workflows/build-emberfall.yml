name: Build Emberfall

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Unzip project
        run: unzip -o EmberfallSurvivors.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ember-survivors
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Emberfall-apk
          path: ember-survivors/app/build/outputs/apk/release/*.apk
